name: Release

# Push a tag like v0.1.0 to release that version to Maven Central. The repository itself stays on -SNAPSHOT;
# the version is set from the tag for this build only. Published versions can never be changed or deleted.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Writes a settings.xml server "central" that reads the Central Portal token from these env vars.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Set version from tag
        run: |
          ./mvnw -v
          ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Test, sign and publish to Maven Central
        run: ./mvnw -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Upload the bundle for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: |
            target/central-staging/
            target/central-publishing/

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Diffsert ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

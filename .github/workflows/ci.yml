name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The delta-oplog behavior is a server implementation detail, so new server patches are picked up weekly
  # (the matrix uses floating minor tags) even without code changes.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }} / MongoDB ${{ matrix.mongo }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
        mongo: ["5.0", "6.0", "7.0", "8.0", "8.2", "8.3", "9.0"]
        include:
          # MongoDB 8.0 and 8.3 refuse to start on the 7.0.0 kernel of ubuntu-latest (since image 20261018), although
          # it contains the rseq fix: https://jira.mongodb.org/browse/SERVER-136848. Ubuntu 22.04 runners have 6.8.
          # Move back once a server patch fixes the check.
          - mongo: "8.0"
            runner: ubuntu-22.04
          - mongo: "8.3"
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run integration tests
        run: ./mvnw -B -ntp verify -Dmongo.image=mongo:${{ matrix.mongo }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}-mongo-${{ matrix.mongo }}
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/

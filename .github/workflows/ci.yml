name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The delta-oplog behavior is a server implementation detail, so new server patches are picked up weekly
  # (the matrix uses floating minor tags) even without code changes.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: MongoDB ${{ matrix.mongo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongo: ["5.0", "6.0", "7.0", "8.0", "8.2", "8.3", "9.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and run integration tests
        run: mvn -B -ntp verify -Dmongo.image=mongo:${{ matrix.mongo }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-mongo-${{ matrix.mongo }}
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
